name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      publish: ${{ steps.prepare.outputs.publish }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Prepare the release
        id: prepare
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          # The version in project.godot is the release source of truth.
          $versionLine = Select-String -Path project.godot -Pattern '^config/version="([^"]+)"' | Select-Object -First 1
          if ($null -eq $versionLine) {
            throw 'project.godot has no application/config/version.'
          }
          $version = $versionLine.Matches[0].Groups[1].Value
          if ($version -notmatch '^\d+\.\d+(\.\d+)?([-+][0-9A-Za-z.-]+)?$') {
            throw "Version '$version' is not a release version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

          $previousErrorAction = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view "v$version" --repo "$env:GITHUB_REPOSITORY" 2>$null | Out-Null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $previousErrorAction
          if ($releaseExists) {
            "publish=false" >> $env:GITHUB_OUTPUT
            Write-Output "Release v$version already exists. The build is skipped."
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
            Write-Output "Release v$version is new."
          }
          exit 0

  build:
    needs: [prepare]
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/build-presets.yml
    secrets: inherit

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          gh release create "${{ needs.prepare.outputs.tag }}" release/* \
            --title "LVE ${{ needs.prepare.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.sha }}" \
            --repo "${{ github.repository }}"
