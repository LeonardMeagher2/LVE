name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      publish: ${{ steps.prepare.outputs.publish }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Prepare the release
        id: prepare
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          # The version in project.godot is the release source of truth.
          $versionLine = Select-String -Path project.godot -Pattern '^config/version="([^"]+)"' | Select-Object -First 1
          if ($null -eq $versionLine) {
            throw 'project.godot has no application/config/version.'
          }
          $version = $versionLine.Matches[0].Groups[1].Value
          if ($version -notmatch '^\d+\.\d+(\.\d+)?([-+][0-9A-Za-z.-]+)?$') {
            throw "Version '$version' is not a release version."
          }

          # Every runnable export preset becomes one release asset.
          $presets = @()
          $runnable = @{}
          $current = $null
          $inOptions = $false
          $inRunnable = $false
          foreach ($line in Get-Content export_presets.cfg) {
            if ($line -match '^\[runnable_presets\]\s*$') {
              if ($null -ne $current) { $presets += $current; $current = $null }
              $inOptions = $false
              $inRunnable = $true
              continue
            }
            if ($line -match '^\[preset\.(\d+)\]\s*$') {
              if ($null -ne $current) { $presets += $current }
              $current = [ordered]@{ options = @{} }
              $inOptions = $false
              $inRunnable = $false
              continue
            }
            if ($line -match '^\[preset\.\d+\.options\]\s*$') {
              $inOptions = $true
              $inRunnable = $false
              continue
            }
            if ($line -match '^\[') {
              if ($null -ne $current) { $presets += $current; $current = $null }
              $inOptions = $false
              $inRunnable = $false
              continue
            }
            if ($inRunnable) {
              if ($line -match '^([^=]+)=(.*)$') {
                $runnable[$Matches[1].Trim().Trim('"')] = $true
              }
              continue
            }
            if ($null -eq $current -or $line -notmatch '^([^=]+)=(.*)$') { continue }
            $key = $Matches[1].Trim()
            $value = $Matches[2].Trim()
            if ($value.StartsWith('"') -and $value.EndsWith('"')) {
              $value = $value.Substring(1, $value.Length - 2)
            }
            if ($inOptions) {
              if ($key -eq 'binary_format/architecture') { $current.options[$key] = $value }
            } elseif ($key -in @('name', 'platform', 'export_path', 'runnable')) {
              $current[$key] = $value
            }
          }
          if ($null -ne $current) { $presets += $current }

          $rules = @{
            'Windows Desktop' = @{ runner = 'windows-latest'; package = 'windows'; arch = 'x86_64'; extension = 'zip'; slug = 'windows' }
            'Linux'           = @{ runner = 'ubuntu-latest';  package = 'linux';   arch = 'x86_64'; extension = 'tar.gz'; slug = 'linux' }
            'Linux/X11'       = @{ runner = 'ubuntu-latest';  package = 'linux';   arch = 'x86_64'; extension = 'tar.gz'; slug = 'linux' }
            'macOS'           = @{ runner = 'macos-latest';   package = 'macos';   arch = 'universal'; extension = 'zip'; slug = 'macos' }
            'Web'             = @{ runner = 'ubuntu-latest';  package = 'web';     arch = ''; extension = 'zip'; slug = 'web' }
          }

          $entries = @()
          foreach ($preset in $presets) {
            $name = [string]$preset['name']
            if (-not $name) { throw 'A preset is missing its name.' }
            $isRunnable = $runnable.ContainsKey($name) -or ([string]$preset['runnable']).ToLowerInvariant() -eq 'true'
            if (-not $isRunnable) { continue }
            $platform = [string]$preset['platform']
            $exportPath = [string]$preset['export_path']
            if (-not $platform -or -not $exportPath) {
              throw "The runnable preset '$name' is missing platform or export_path."
            }
            if (-not $rules.ContainsKey($platform)) {
              throw "No release rule for platform '$platform'. Add one in the prepare step."
            }
            $rule = $rules[$platform]
            $arch = [string]$preset.options['binary_format/architecture']
            if (-not $arch) { $arch = $rule.arch }
            $archPart = if ($arch) { "-$arch" } else { '' }
            $extension = $rule.extension
            if ($exportPath.EndsWith('.zip')) { $extension = 'zip' }
            $entries += @{
              preset = $name
              runner = $rule.runner
              package = $rule.package
              export_path = $exportPath
              asset = "LVE-$($rule.slug)$archPart.$extension"
            }
          }

          if ($entries.Count -eq 0) {
            throw 'export_presets.cfg has no runnable export presets.'
          }
          $duplicates = $entries | Group-Object { $_.asset } | Where-Object { $_.Count -gt 1 }
          if ($duplicates) {
            $names = ($duplicates | ForEach-Object { $_.Name }) -join ', '
            throw "Two presets produce the same release asset: $names."
          }

          $matrix = @{ include = @($entries) } | ConvertTo-Json -Depth 5 -Compress
          Write-Output "Release matrix: $matrix"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "matrix=$matrix" >> $env:GITHUB_OUTPUT

          $previousErrorAction = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view "v$version" --repo "$env:GITHUB_REPOSITORY" 2>$null | Out-Null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $previousErrorAction
          if ($releaseExists) {
            "publish=false" >> $env:GITHUB_OUTPUT
            Write-Output "Release v$version already exists. The build is skipped."
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
            Write-Output "Release v$version is new."
          }
          exit 0

  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install Godot 4.7.2 and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $godotVersion = '4.7.2'
          $base = "https://github.com/godotengine/godot/releases/download/$godotVersion-stable"
          $archives = @{
            Windows = "Godot_v$godotVersion-stable_win64.exe.zip"
            Linux   = "Godot_v$godotVersion-stable_linux.x86_64.zip"
            macOS   = "Godot_v$godotVersion-stable_macos.universal.zip"
          }
          $archive = $archives[$env:RUNNER_OS]
          if (-not $archive) { throw "No Godot download for $env:RUNNER_OS." }

          $tools = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $zip = Join-Path $tools 'godot.zip'
          Invoke-WebRequest "$base/$archive" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $tools

          if ($env:RUNNER_OS -eq 'Windows') {
            $godot = Join-Path $tools "Godot_v$godotVersion-stable_win64.exe"
          } elseif ($env:RUNNER_OS -eq 'macOS') {
            $godot = Join-Path $tools 'Godot.app/Contents/MacOS/Godot'
          } else {
            $godot = Join-Path $tools "Godot_v$godotVersion-stable_linux.x86_64"
          }
          if (-not (Test-Path $godot)) { throw "The Godot executable is missing: $godot" }
          if ($env:RUNNER_OS -ne 'Windows') { & chmod +x $godot }
          "GODOT=$godot" >> $env:GITHUB_ENV

          $templates = Join-Path $tools 'templates.zip'
          Invoke-WebRequest "$base/Godot_v$godotVersion-stable_export_templates.tpz" -OutFile $templates
          $templateRoot = Join-Path $tools 'templates'
          Expand-Archive -LiteralPath $templates -DestinationPath $templateRoot

          $templateDir = if ($env:RUNNER_OS -eq 'Windows') {
            Join-Path $env:APPDATA "Godot/export_templates/$godotVersion.stable"
          } elseif ($env:RUNNER_OS -eq 'macOS') {
            Join-Path $HOME "Library/Application Support/Godot/export_templates/$godotVersion.stable"
          } else {
            Join-Path $HOME ".local/share/godot/export_templates/$godotVersion.stable"
          }
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          Copy-Item -Path (Join-Path $templateRoot 'templates/*') -Destination $templateDir -Recurse -Force

      - name: Export ${{ matrix.preset }}
        shell: pwsh
        env:
          PRESET: ${{ matrix.preset }}
          EXPORT_PATH: ${{ matrix.export_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exportPath = $env:EXPORT_PATH
          $parent = Split-Path -Parent $exportPath
          if ($parent) { New-Item -ItemType Directory -Force $parent | Out-Null }

          & $env:GODOT --headless --path . --import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:GODOT --headless --path . --export-release $env:PRESET $exportPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $exportPath)) { throw "The export did not write $exportPath." }

      - name: Package ${{ matrix.asset }}
        shell: pwsh
        env:
          PACKAGE: ${{ matrix.package }}
          EXPORT_PATH: ${{ matrix.export_path }}
          ASSET: ${{ matrix.asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exportPath = $env:EXPORT_PATH
          New-Item -ItemType Directory -Force release | Out-Null
          $out = Join-Path 'release' $env:ASSET

          function Get-PckPath([string]$path) {
            $pck = [System.IO.Path]::ChangeExtension($path, '.pck')
            if (Test-Path $pck) { return $pck }
            return $null
          }

          if ($exportPath.EndsWith('.zip')) {
            Copy-Item -LiteralPath $exportPath -Destination $out -Force
          } else {
            switch ($env:PACKAGE) {
              'windows' {
                $files = @($exportPath)
                $pck = Get-PckPath $exportPath
                if ($pck) { $files += $pck }
                Compress-Archive -LiteralPath $files -DestinationPath $out -Force
              }
              'linux' {
                & chmod +x $exportPath
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                $parent = Split-Path -Parent $exportPath
                if (-not $parent) { $parent = '.' }
                $names = @((Split-Path -Leaf $exportPath))
                $pck = Get-PckPath $exportPath
                if ($pck) { $names += (Split-Path -Leaf $pck) }
                & tar -czf $out -C $parent @names
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
              'macos' {
                if ($exportPath.EndsWith('.app')) {
                  & ditto -c -k --sequesterRsrc --keepParent $exportPath $out
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                } else {
                  throw 'The macOS export path must end with .app or .zip.'
                }
              }
              'web' {
                $parent = Split-Path -Parent $exportPath
                if (-not $parent) { $parent = '.' }
                Compress-Archive -Path (Join-Path $parent '*') -DestinationPath $out -Force
              }
              default {
                throw "Unknown package type '$($env:PACKAGE)'."
              }
            }
          }
          if (-not (Test-Path $out)) { throw "The package step did not write $out." }

      - name: Store ${{ matrix.asset }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          gh release create "${{ needs.prepare.outputs.tag }}" release/* \
            --title "LVE ${{ needs.prepare.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.sha }}" \
            --repo "${{ github.repository }}"
