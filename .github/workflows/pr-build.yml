name: PR build

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/build-presets.yml
    secrets: inherit

  publish:
    if: github.event.action != 'closed'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Download the builds
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Publish the PR release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          tag="pr-$PR_NUMBER"
          short=$(echo "$HEAD_SHA" | cut -c1-7)
          notes="Build of PR #$PR_NUMBER. Commit $short. $PR_TITLE"
          ls -l release
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            for asset in $(gh release view "$tag" --json assets --jq '.assets[].name' --repo "${{ github.repository }}"); do
              gh release delete-asset "$tag" "$asset" --yes --repo "${{ github.repository }}"
            done
            gh release upload "$tag" release/* --clobber --repo "${{ github.repository }}"
            gh release edit "$tag" --notes "$notes" --repo "${{ github.repository }}"
          else
            gh release create "$tag" release/* \
              --title "PR #$PR_NUMBER" \
              --notes "$notes" \
              --prerelease \
              --target "$HEAD_SHA" \
              --repo "${{ github.repository }}"
          fi

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Delete the PR release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh release view "pr-$PR_NUMBER" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "pr-$PR_NUMBER" --yes --cleanup-tag --repo "${{ github.repository }}"
          fi

      - name: Delete the PR build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -e
          ids=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
            --jq ".artifacts[] | select(.workflow_run.head_branch == \"$HEAD_REF\") | .id")
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
