name: Build Android

on:
  workflow_call:
    inputs:
      apk_name:
        type: string
        default: LVE-canary.apk
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_ALIAS:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install Godot 4.7.2 and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $godotVersion = '4.7.2'
          $base = "https://github.com/godotengine/godot/releases/download/$godotVersion-stable"
          $tools = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $zip = Join-Path $tools 'godot.zip'
          Invoke-WebRequest "$base/Godot_v$godotVersion-stable_linux.x86_64.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $tools
          $godot = Join-Path $tools "Godot_v$godotVersion-stable_linux.x86_64"
          if (-not (Test-Path $godot)) { throw "The Godot executable is missing: $godot" }
          & chmod +x $godot
          "GODOT=$godot" >> $env:GITHUB_ENV

          $templates = Join-Path $tools 'templates.zip'
          Invoke-WebRequest "$base/Godot_v$godotVersion-stable_export_templates.tpz" -OutFile $templates
          $templateRoot = Join-Path $tools 'templates'
          Expand-Archive -LiteralPath $templates -DestinationPath $templateRoot
          $templateDir = Join-Path $HOME ".local/share/godot/export_templates/$godotVersion.stable"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          Copy-Item -Path (Join-Path $templateRoot 'templates/*') -Destination $templateDir -Recurse -Force

      - name: Prepare the Android toolchain
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = $env:ANDROID_HOME }
          if (-not $sdk) { $sdk = '/usr/local/lib/android/sdk' }
          $java = $env:JAVA_HOME
          if (-not $java) { throw 'JAVA_HOME is not set.' }

          $licenses = Join-Path $sdk 'licenses'
          New-Item -ItemType Directory -Force $licenses | Out-Null
          Set-Content -Path (Join-Path $licenses 'android-sdk-license') -Value "24333f8a63b6825ea9c5514f83c2829b004d1fee"
          & (Join-Path $sdk 'cmdline-tools/latest/bin/sdkmanager') "build-tools;36.0.0" "platforms;android-36" "platform-tools"
          if ($LASTEXITCODE -ne 0) { throw 'sdkmanager failed.' }

          $keystore = Join-Path $HOME 'lve-android.keystore'
          if (-not $env:ANDROID_KEYSTORE_BASE64) { throw 'The keystore secret is missing.' }
          [System.IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))

          $settingsDir = Join-Path $HOME '.config/godot'
          New-Item -ItemType Directory -Force $settingsDir | Out-Null
          $settings = @(
            '[gd_resource type="EditorSettings" format=3]'
            ''
            '[resource]'
            "export/android/android_sdk_path = `"$sdk`""
            "export/android/java_sdk_path = `"$java`""
            "export/android/debug_keystore = `"$keystore`""
            "export/android/debug_keystore_user = `"$env:ANDROID_KEYSTORE_ALIAS`""
            "export/android/debug_keystore_pass = `"$env:ANDROID_KEYSTORE_PASSWORD`""
          ) -join "`n"
          Set-Content -Path (Join-Path $settingsDir 'editor_settings-4.7.tres') -Value $settings

      - name: Export the APK
        shell: pwsh
        env:
          APK_NAME: ${{ inputs.apk_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $target = "dist/canary/$env:APK_NAME"
          New-Item -ItemType Directory -Force dist/canary | Out-Null
          & $env:GODOT --headless --path . --import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:GODOT --headless --path . --export-debug "Android" $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $target)) { throw "The export did not write $target." }
          Get-Item $target | Select-Object Name, Length | Out-String | Write-Output

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.apk_name }}
          path: dist/canary/${{ inputs.apk_name }}
          if-no-files-found: error
