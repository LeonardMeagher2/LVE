name: Canary

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: canary-main
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-presets.yml
    secrets: inherit

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Refresh the canary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(grep -m1 '^config/version=' project.godot | cut -d'"' -f2)
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          notes="The newest build from main. Version $version, commit $short."
          ls -l release
          gh release view canary --repo "${{ github.repository }}" >/dev/null 2>&1 && \
            gh release delete canary --yes --cleanup-tag --repo "${{ github.repository }}"
          gh release create canary release/* \
            --title "Canary build" \
            --notes "$notes" \
            --prerelease \
            --target "${{ github.sha }}" \
            --repo "${{ github.repository }}"
